# Free demonstration: web compute sleeps; overdue jobs resume when it wakes.
services:
  - type: web
    name: tarang-prototype
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn tarang.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: tarang-prototype-db
          property: connectionString
      - key: TELEGRAM_MODE
        value: webhook
      - key: MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPERATOR_TOKEN
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
databases:
  - name: tarang-prototype-db
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    ipAllowList: []
